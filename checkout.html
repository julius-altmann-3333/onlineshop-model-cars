<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScaleSpeed Models • Checkout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root { --yellow: #ffd700; --black: #111111; }
        body { background: #000; color: white; }
        .navbar { background: #000; border-bottom: 4px solid var(--yellow); }
        .card { background: #222; border: 2px solid var(--yellow); }
        .btn-yellow { background: var(--yellow); color: #000; font-weight: 900; }
        .section-title { color: var(--yellow); }
        .payment-gateway {
            background: linear-gradient(90deg, #ffd700, #000);
            color: #000;
            font-weight: 900;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
        <a class="navbar-brand" href="index.html">SCALE<span style="color:#ffd700">SPEED</span> MODELS</a>
        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav ms-auto">
                <li><a class="nav-link" href="index.html">SHOP</a></li>
                <li><a class="nav-link" href="cart.html">CART</a></li>
                <li class="nav-item"><a class="nav-link active" href="#">CHECKOUT</a></li>
                <li><a class="nav-link" href="contact.html">CONTACT</a></li>
            </ul>
        </div>
    </div>
</nav>

<section class="py-5">
    <div class="container">
        <h1 class="display-4 text-center section-title">SECURE CHECKOUT</h1>
        
        <div class="row">
            <div class="col-lg-8">
                <div class="card p-4">
                    <h5>Card Details (Demo Stripe)</h5>
                    <div class="mb-3">
                        <input type="text" class="form-control" placeholder="4242 4242 4242 4242" value="4242 4242 4242 4242">
                    </div>
                    <div class="row">
                        <div class="col-6"><input type="text" class="form-control" placeholder="MM/YY"></div>
                        <div class="col-6"><input type="text" class="form-control" placeholder="CVC"></div>
                    </div>
                </div>
            </div>
            
            <div class="col-lg-4">
                <div class="card p-4 h-100">
                    <h4 class="section-title">Order Total</h4>
                    <div id="checkout-total" class="price fs-3">$0.00</div>
                    <button onclick="processPayment()" class="btn btn-yellow btn-lg w-100 mt-4">
                        PAY SECURELY WITH STRIPE
                    </button>
                    <small class="text-warning text-center d-block mt-3">🔒 256-bit SSL • PCI Compliant</small>
                </div>
            </div>
        </div>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// Load cart total
const cartItems = JSON.parse(localStorage.getItem('cartItems')) || [];
let subtotal = cartItems.reduce((sum, i) => sum + (i.price * i.quantity), 0);
document.getElementById('checkout-total').textContent = `$${(subtotal + 8.99).toFixed(2)}`;

// Demo payment
function processPayment() {
    const total = subtotal + 8.99;
    const success = confirm(`✅ $${total.toFixed(2)} processed successfully!\n\nThank you for shopping ScaleSpeed Models!\n\n(Real site: Stripe.js integration here)`);
    if (success) {
        localStorage.removeItem('cartItems');
        alert('Order #2026-001 confirmed. Tracking will be sent to your email.');
    }
}
</script>
</body>
</html>
